<!DOCTYPE html>
<html lang="en">
<head>
  <link rel="icon" type="image/svg+xml" href="favicon.svg?v=303">
  <link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png?v=303">
  <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png?v=303">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Masterclass Students</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="permissions.js"></script>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#000000">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Ridleyacademy">
  <link rel="apple-touch-icon" href="apple-touch-icon.png?v=303">
  <link rel="stylesheet" href="mobile.css">
  <style>
    :root{
      --bg:#080a14; --surface:#0f1120; --surface2:#141728; --surface3:#191e30;
      --border:#1f2438; --border-light:#272d45;
      --text:#eaecf8; --text-muted:#7880a8; --text-dim:#3e4668;
      --blue:#6b9eff; --blue-bg:rgba(107,158,255,0.12);
      --green:#34d399; --green-bg:rgba(52,211,153,0.12);
      --gold:#fbbf24; --gold-bg:rgba(251,191,36,0.12);
      --red:#f87171; --red-bg:rgba(248,113,113,0.12);
      --purple:#a78bfa;
    }
    body.light{ --bg:#f3f4fb; --surface:#fff; --surface2:#f6f7fc; --surface3:#eef0f8; --border:#e2e5f0; --border-light:#d3d7e6; --text:#1a1d2e; --text-muted:#5a6180; --text-dim:#9aa1bd; }
    *{ box-sizing:border-box; }
    body{ margin:0; background:var(--bg); color:var(--text); font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif; font-size:14px; }
    a{ color:var(--blue); }
    /* Top bar */
    .topbar{ display:flex; align-items:center; gap:10px; padding:10px 18px; background:linear-gradient(180deg,rgba(15,17,32,0.96),rgba(8,10,20,0.92)); border-bottom:1px solid var(--border); position:sticky; top:0; z-index:100; backdrop-filter:blur(14px); }
    body.light .topbar{ background:linear-gradient(180deg,#fff,#f6f7fc); }
    .topbar-logo{ width:26px; height:26px; border-radius:8px; background:linear-gradient(135deg,var(--green),#22b07d); display:flex; align-items:center; justify-content:center; }
    .topbar-brand{ font-weight:800; letter-spacing:0.01em; }
    .topbar-spacer{ flex:1; }
    .tbtn{ background:var(--surface2); border:1px solid var(--border); color:var(--text); border-radius:9px; padding:6px 11px; font-size:0.82rem; cursor:pointer; display:inline-flex; align-items:center; gap:6px; font-family:inherit; }
    .tbtn:hover{ border-color:var(--border-light); }
    .tbtn-primary{ background:linear-gradient(135deg,var(--green),#22b07d); color:#06231a; border:none; font-weight:700; }
    .nav-dropdown{ position:relative; }
    .nav-dropdown-menu{ display:none; position:absolute; top:100%; right:0; background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:6px; margin-top:6px; min-width:210px; z-index:200; }
    .user-pill{ display:flex; align-items:center; gap:8px; background:var(--surface2); border:1px solid var(--border); border-radius:999px; padding:3px 10px 3px 4px; }
    .user-pill-av{ width:26px; height:26px; border-radius:50%; background:var(--purple); color:#0b0c14; display:flex; align-items:center; justify-content:center; font-weight:800; font-size:0.8rem; }
    .user-pill-email{ font-size:0.78rem; color:var(--text-muted); max-width:150px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
    /* Layout */
    .mc-wrap{ display:grid; grid-template-columns:340px 1fr; gap:16px; padding:16px; align-items:start; }
    @media(max-width:880px){ .mc-wrap{ grid-template-columns:1fr; } .mc-main.thread-open ~ .mc-list-card, body.mc-thread .mc-list-card{ } }
    .card{ background:var(--surface); border:1px solid var(--border); border-radius:16px; }
    .mc-list-card{ overflow:hidden; }
    .mc-list-head{ display:flex; align-items:center; gap:10px; padding:14px 14px 8px; }
    .mc-list-title{ font-weight:800; font-size:1.05rem; flex:1; }
    .mc-count{ font-size:0.72rem; color:var(--text-muted); }
    .mc-search{ width:calc(100% - 28px); margin:0 14px 8px; background:var(--surface2); border:1px solid var(--border); border-radius:10px; padding:9px 12px; color:var(--text); font-size:0.88rem; outline:none; }
    .mc-search:focus{ border-color:var(--blue); }
    .mc-chips{ display:flex; flex-wrap:wrap; gap:5px; padding:0 14px 10px; }
    .mc-chip{ background:var(--surface2); border:1px solid var(--border); border-radius:999px; color:var(--text-muted); font-size:0.74rem; padding:4px 10px; cursor:pointer; }
    .mc-chip.active{ background:var(--green-bg); border-color:var(--green); color:var(--green); }
    .mc-list{ max-height:calc(100vh - 220px); overflow-y:auto; }
    .mc-row{ display:flex; align-items:center; gap:10px; padding:9px 14px; border-top:1px solid var(--border); cursor:pointer; }
    .mc-row:hover{ background:var(--surface2); }
    .mc-row.active{ background:var(--blue-bg); }
    .mc-av{ width:34px; height:34px; border-radius:50%; background:var(--surface3); color:var(--text); display:flex; align-items:center; justify-content:center; font-weight:700; font-size:0.8rem; flex-shrink:0; }
    .mc-rowmid{ flex:1; min-width:0; }
    .mc-rowname{ font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
    .mc-rowsub{ font-size:0.74rem; color:var(--text-muted); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
    .mc-rowbadges{ display:flex; gap:4px; align-items:center; flex-shrink:0; }
    .mc-mini{ font-size:0.64rem; padding:1px 6px; border-radius:999px; font-weight:700; }
    .mc-empty{ padding:60px 20px; text-align:center; color:var(--text-dim); }
    /* Status dots/chips */
    .st{ display:inline-block; font-size:0.7rem; font-weight:700; padding:2px 9px; border-radius:999px; }
    .st-Active{ background:var(--green-bg); color:var(--green); }
    .st-Refunded{ background:var(--red-bg); color:var(--red); }
    .st-Completed{ background:var(--blue-bg); color:var(--blue); }
    .st-Deadfile{ background:rgba(120,128,168,0.18); color:var(--text-muted); }
    /* Profile */
    .mc-main{ min-height:60vh; }
    .prof-head{ display:flex; align-items:flex-start; gap:14px; padding:16px 18px; border-bottom:1px solid var(--border); flex-wrap:wrap; }
    .prof-name{ font-size:1.3rem; font-weight:800; }
    .prof-sub{ font-size:0.82rem; color:var(--text-muted); margin-top:2px; }
    .prof-actions{ display:flex; gap:7px; flex-wrap:wrap; padding:12px 18px; border-bottom:1px solid var(--border); }
    .pbtn{ background:var(--surface2); border:1px solid var(--border); color:var(--text); border-radius:9px; padding:6px 11px; font-size:0.8rem; cursor:pointer; display:inline-flex; align-items:center; gap:6px; }
    .pbtn:hover{ border-color:var(--border-light); }
    .pbtn .n{ background:var(--surface3); border-radius:999px; padding:0 6px; font-size:0.7rem; font-weight:700; }
    .pbtn.danger:hover{ background:var(--red-bg); color:var(--red); border-color:var(--red); }
    .prof-body{ padding:12px 18px 18px; }
    /* Collapsible profile sections (native <details>), MS-CRM style */
    .mc-sec{ margin-bottom:4px; }
    .mc-sec > summary{ display:flex; align-items:center; gap:12px; margin:12px 0 10px; padding-bottom:6px; border-bottom:1px solid var(--border); cursor:pointer; list-style:none; user-select:none; transition:opacity .12s; }
    .mc-sec > summary::-webkit-details-marker{ display:none; }
    .mc-sec > summary:hover{ opacity:0.85; }
    .mc-sec:not([open]) > summary{ margin-bottom:0; }
    .mc-sec-title{ font-size:0.7rem; font-weight:800; text-transform:uppercase; letter-spacing:0.1em; color:var(--green); }
    .mc-sec-line{ flex:1; }
    .mc-sec-caret{ color:var(--text-dim); font-size:0.7rem; transition:transform .15s; flex-shrink:0; }
    .mc-sec[open] > summary .mc-sec-caret{ transform:rotate(180deg); }
    .sec-grid{ display:grid; grid-template-columns:1fr 1fr; gap:9px 16px; align-items:start; }
    .sec-grid .full{ grid-column:1/-1; }
    @media(max-width:640px){ .sec-grid{ grid-template-columns:1fr; } }
    .sec{ }
    .sec-t{ font-size:0.7rem; text-transform:uppercase; letter-spacing:0.05em; color:var(--text-dim); font-weight:800; margin:0 0 8px; }
    .fld{ margin-bottom:9px; }
    .fld label{ display:block; font-size:0.72rem; color:var(--text-muted); margin-bottom:3px; }
    .fld input, .fld select, .fld textarea{ width:100%; background:var(--surface2); border:1px solid var(--border); border-radius:8px; padding:8px 10px; color:var(--text); font-size:0.85rem; outline:none; font-family:inherit; }
    .fld input:focus, .fld select:focus, .fld textarea:focus{ border-color:var(--blue); }
    .fld textarea{ resize:vertical; min-height:56px; }
    .fld-row{ display:flex; gap:6px; align-items:center; }
    .save-row{ grid-column:1/-1; display:flex; gap:10px; justify-content:flex-end; padding-top:6px; border-top:1px dashed var(--border); }
    /* Panels (turnovers/alerts/wins/notes) */
    .panel{ grid-column:1/-1; border-top:1px solid var(--border); padding-top:14px; }
    .panel-h{ display:flex; align-items:center; justify-content:space-between; margin-bottom:8px; }
    .panel-h .sec-t{ margin:0; }
    .item{ background:var(--surface2); border:1px solid var(--border); border-radius:11px; padding:10px 12px; margin-bottom:8px; }
    .item-top{ display:flex; justify-content:space-between; gap:10px; align-items:baseline; }
    .item-title{ font-weight:700; font-size:0.9rem; }
    .item-meta{ font-size:0.72rem; color:var(--text-muted); white-space:nowrap; }
    .item-body{ font-size:0.85rem; color:var(--text); margin-top:4px; white-space:pre-wrap; word-break:break-word; }
    .item-actions{ display:flex; gap:8px; margin-top:8px; flex-wrap:wrap; }
    .lnk{ background:none; border:none; color:var(--blue); font-size:0.76rem; cursor:pointer; padding:0; }
    .lnk.red{ color:var(--red); }
    .lnk.dim{ color:var(--text-muted); }
    .cmt{ border-left:2px solid var(--border-light); margin:6px 0 0 4px; padding:4px 0 4px 10px; font-size:0.8rem; }
    .cmt-meta{ font-size:0.68rem; color:var(--text-muted); }
    .badge-open{ background:var(--gold-bg); color:var(--gold); }
    .badge-done{ background:var(--green-bg); color:var(--green); }
    .pill-open{ font-size:0.62rem; font-weight:700; padding:1px 7px; border-radius:999px; }
    /* Response / Resolution inline form + threads (MS-CRM parity) */
    .thread-h{ font-size:0.66rem; font-weight:800; text-transform:uppercase; letter-spacing:0.08em; color:var(--text-muted); margin:10px 0 4px; }
    .result-box{ margin-top:10px; padding:9px 11px; border-left:3px solid var(--green); background:var(--green-bg); border-radius:8px; }
    .result-h{ font-size:0.66rem; font-weight:800; text-transform:uppercase; letter-spacing:0.08em; color:var(--green); margin-bottom:3px; }
    .ans{ margin-top:11px; padding-top:9px; border-top:1px solid var(--border); }
    .ans-tabs{ display:flex; gap:6px; margin-bottom:8px; }
    .ans-opt{ flex:1; display:flex; align-items:center; justify-content:center; gap:6px; padding:6px; border:1px solid var(--border); border-radius:8px; font-size:0.76rem; cursor:pointer; color:var(--text); }
    .ans-opt input{ cursor:pointer; }
    .ans-note{ width:100%; background:var(--surface2); border:1px solid var(--border); border-radius:8px; padding:8px 10px; color:var(--text); font-size:0.84rem; outline:none; font-family:inherit; resize:vertical; min-height:54px; }
    .ans-note:focus{ border-color:var(--blue); }
    .ans-btn{ margin-top:8px; }
    /* Pop-up list modal (Turn overs / Alerts / Wins / Notes) — sits under the small .ov modal */
    .lm-ov{ position:fixed; inset:0; background:rgba(4,6,14,0.7); display:flex; align-items:center; justify-content:center; z-index:260; padding:18px; }
    .lm-box{ background:var(--surface); border:1px solid var(--border-light); border-radius:16px; width:min(680px,96vw); max-height:88vh; display:flex; flex-direction:column; overflow:hidden; }
    .lm-head{ display:flex; align-items:center; gap:10px; padding:14px 18px; border-bottom:1px solid var(--border); }
    .lm-title{ font-size:1.02rem; font-weight:800; letter-spacing:-0.01em; }
    .lm-sub{ font-size:0.74rem; color:var(--text-muted); margin-top:2px; }
    .lm-x{ background:none; border:none; color:var(--text-muted); font-size:1.5rem; line-height:1; cursor:pointer; padding:0 4px; }
    .lm-body{ flex:1; overflow-y:auto; padding:14px 18px; }
    /* Modal */
    .ov{ position:fixed; inset:0; background:rgba(4,6,14,0.7); display:none; align-items:center; justify-content:center; z-index:300; padding:16px; }
    .ov.open{ display:flex; }
    .modal{ background:var(--surface); border:1px solid var(--border-light); border-radius:16px; width:min(460px,96vw); max-height:88vh; overflow-y:auto; padding:18px; }
    .modal h3{ margin:0 0 12px; font-size:1.05rem; }
    .modal .fld:last-of-type{ margin-bottom:14px; }
    .modal-row{ display:flex; gap:10px; justify-content:flex-end; }
    /* Toast */
    .toast{ position:fixed; bottom:24px; left:50%; transform:translateX(-50%) translateY(20px); background:var(--surface3); border:1px solid var(--border-light); color:var(--text); padding:10px 18px; border-radius:10px; opacity:0; transition:all .2s; z-index:400; font-size:0.86rem; }
    .toast.show{ opacity:1; transform:translateX(-50%) translateY(0); }
    .hidden{ display:none !important; }
  </style>
</head>
<body>
<div id="app">
  <header class="topbar">
    <div class="topbar-logo"><svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#06231a" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></svg></div>
    <div class="topbar-brand">Masterclass CRM</div>
    <button class="tbtn" id="gqAlerts" title="All alerts (or the ones you're on)">⚠ Alerts</button>
    <button class="tbtn" id="gqTurnovers" title="All turn-overs (or the ones you're on)">↪ Turn-overs</button>
    <button class="tbtn" id="gqContacts" title="All logged contacts (or yours)">✆ Contacts</button>
    <div class="topbar-spacer"></div>
    <button class="tbtn" id="refreshBtn" title="Refresh"><svg xmlns="http://www.w3.org/2000/svg" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="23 4 23 10 17 10"/><polyline points="1 20 1 14 7 14"/><path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"/></svg> Refresh</button>
    <button class="tbtn" id="themeBtn" style="font-size:1rem;" title="Toggle theme">◐</button>
    <div class="nav-dropdown" id="navDropdown"><button class="tbtn" id="navDropdownBtn">Dashboards ▾</button><div class="nav-dropdown-menu" id="navDropMenu"></div></div>
    <div class="user-pill"><div class="user-pill-av" id="userAvatar">U</div><div class="user-pill-email" id="userEmail">…</div></div>
    <button class="tbtn" id="signOutBtn"><svg xmlns="http://www.w3.org/2000/svg" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg> Sign Out</button>
  </header>

  <div class="mc-wrap">
    <!-- List -->
    <aside class="card mc-list-card">
      <div class="mc-list-head">
        <div class="mc-list-title">Students <span class="mc-count" id="mcCount"></span></div>
        <button class="tbtn tbtn-primary" id="newBtn">＋ New</button>
      </div>
      <input class="mc-search" id="mcSearch" placeholder="Search name, email, rep…">
      <div class="mc-chips" id="mcChips">
        <button class="mc-chip active" data-f="all">All</button>
        <button class="mc-chip" data-f="Active">Active</button>
        <button class="mc-chip" data-f="Completed">Completed</button>
        <button class="mc-chip" data-f="Refunded">Refunded</button>
        <button class="mc-chip" data-f="Dead file">Dead file</button>
        <button class="mc-chip" data-f="alerts">Has alerts</button>
        <button class="mc-chip" data-f="winning">Winning</button>
      </div>
      <div class="mc-list" id="mcList"><div class="mc-empty">Loading…</div></div>
    </aside>

    <!-- Main -->
    <section class="card mc-main" id="mcMain">
      <div class="mc-empty" id="mcMainEmpty">Pick a student, or click ＋ New.</div>
      <div id="mcProfile" class="hidden"></div>
    </section>
  </div>
</div>

<!-- Generic modal -->
<div class="ov" id="ov"><div class="modal" id="modal"></div></div>
<div class="toast" id="toast"></div>

<script src="masterclass.js"></script>
<script src="access-guard.js"></script>
<script src="theme.js"></script>
<script src="changelog.js"></script>
<script src="notifications.js"></script>
<script src="messages-widget.js"></script>
<script src="nav-menu.js"></script>
</body>
</html>
