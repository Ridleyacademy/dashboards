<!DOCTYPE html>
<html lang="en">
<head>
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
  <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mentorship Students</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="permissions.js"></script>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#000000">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Ridleyacademy">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="stylesheet" href="mobile.css">

<style>
  :root {
    --bg: #080a14;
    --surface: #0f1120; --surface2: #141728; --surface3: #191e30;
    --border: #1f2438; --border-light: #272d45;
    --text: #eaecf8; --text-muted: #7880a8; --text-dim: #3e4668;
    --blue: #6b9eff; --blue-glow: rgba(107,158,255,0.3); --blue-bg: rgba(107,158,255,0.1);
    --green: #34d399; --green-glow: rgba(52,211,153,0.3); --green-bg: rgba(52,211,153,0.1);
    --gold: #fbbf24; --gold-bg: rgba(251,191,36,0.1);
    --red: #f87171; --red-bg: rgba(248,113,113,0.1);
    --purple: #a78bfa; --purple-bg: rgba(167,139,250,0.1);
  }
  body.light {
    --bg: #f0f2fa; --surface: #ffffff; --surface2: #f5f6fc; --surface3: #eceef8;
    --border: #dde1f2; --border-light: #ccd1e8;
    --text: #0f1220; --text-muted: #525b82; --text-dim: #9099be;
  }
  body.light .topbar { background: rgba(255,255,255,0.9); }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', Roboto, sans-serif;
    background: var(--bg); color: var(--text); min-height: 100vh; -webkit-font-smoothing: antialiased;
    position: relative; overflow-x: hidden;
  }

  body[data-state="loading"] #app, body[data-state="loading"] #login, body[data-state="loading"] #denied,
  body[data-state="dashboard"] #login, body[data-state="dashboard"] #boot, body[data-state="dashboard"] #denied,
  body[data-state="login"] #app, body[data-state="login"] #boot, body[data-state="login"] #denied,
  body[data-state="denied"] #app, body[data-state="denied"] #boot, body[data-state="denied"] #login { display: none; }
  body[data-state="loading"] #boot { display: flex; }
  body[data-state="login"] #login { display: flex; }
  body[data-state="denied"] #denied { display: flex; }
  body[data-state="dashboard"] #app { display: block; }

  .full-center { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 24px; }
  .login-wrap { width: 100%; max-width: 420px; }
  .login-logo { width: 56px; height: 56px; border-radius: 16px; margin: 0 auto 24px; background: linear-gradient(135deg,#34d399,#10b981); display: flex; align-items: center; justify-content: center; }
  .login-card { background: var(--surface); border: 1px solid var(--border); border-radius: 24px; padding: 40px 36px; box-shadow: 0 32px 80px rgba(0,0,0,0.6); }
  .login-card h1 { font-size: 1.5rem; font-weight: 800; letter-spacing: -0.03em; text-align: center; margin-bottom: 4px; }
  .login-card .sub { color: var(--text-muted); font-size: 0.84rem; text-align: center; margin-bottom: 28px; }
  .input-group { margin-bottom: 12px; }
  .input-label { font-size: 0.7rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.07em; color: var(--text-muted); margin-bottom: 6px; display: block; }
  .auth-input { width: 100%; background: var(--surface2); border: 1px solid var(--border); border-radius: 12px; padding: 13px 16px; color: var(--text); font-size: 0.92rem; outline: none; }
  .auth-input:focus { border-color: var(--green); box-shadow: 0 0 0 3px var(--green-bg); }
  .auth-btn { width: 100%; margin-top: 8px; background: linear-gradient(135deg,#34d399,#10b981); border: none; border-radius: 12px; padding: 14px; color: #0b0c14; font-size: 0.92rem; font-weight: 800; cursor: pointer; }
  .auth-error { color: var(--red); font-size: 0.78rem; margin-top: 10px; min-height: 1em; text-align: center; }
  .spinner { width: 40px; height: 40px; border: 3px solid var(--border); border-top-color: var(--green); border-radius: 50%; animation: spin 0.7s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* Date Range Picker (matches the other dashboards) */
  .daterange-wrap { position: relative; }
  .daterange-btn {
    display: inline-flex; align-items: center; gap: 6px;
    background: var(--surface2); border: 1px solid var(--border); border-radius: 8px;
    padding: 6px 11px; font-size: 0.74rem; color: var(--text-muted); cursor: pointer;
    transition: all 0.15s; white-space: nowrap; font-weight: 600; font-family: inherit;
  }
  .daterange-btn:hover { border-color: var(--border-light); color: var(--text); }
  .daterange-popup {
    display: none; position: absolute; top: calc(100% + 8px); right: 0;
    background: var(--surface); border: 1px solid var(--border); border-radius: 16px;
    padding: 14px; min-width: 270px;
    box-shadow: 0 20px 60px rgba(0,0,0,0.5), 0 0 0 1px rgba(255,255,255,0.03) inset;
    z-index: 500;
  }
  .daterange-popup.open { display: block; }
  .dr-presets { display: flex; flex-direction: column; gap: 2px; }
  .dr-preset {
    display: block; width: 100%; text-align: left; background: none; border: none;
    padding: 9px 12px; border-radius: 9px; font-size: 0.8rem; font-weight: 600;
    color: var(--text-muted); cursor: pointer; transition: all 0.12s; font-family: inherit;
  }
  .dr-preset:hover { background: var(--surface2); color: var(--text); }
  .dr-preset.active { background: var(--green-bg); color: var(--green); }
  .dr-divider { height: 1px; background: var(--border); margin: 10px 0; }
  .dr-custom-label { font-size: 0.64rem; font-weight: 800; text-transform: uppercase; letter-spacing: 0.1em; color: var(--text-dim); margin-bottom: 8px; }
  .dr-custom-row { display: flex; align-items: center; gap: 6px; margin-bottom: 10px; }
  .dr-date-input { flex: 1; background: var(--surface2); border: 1px solid var(--border); border-radius: 8px; padding: 7px 8px; color: var(--text); font-size: 0.73rem; outline: none; color-scheme: dark; min-width: 0; }
  .dr-date-input:focus { border-color: var(--green); }
  body.light .dr-date-input { color-scheme: light; }
  .dr-sep { color: var(--text-dim); font-size: 0.7rem; flex-shrink: 0; }
  .dr-apply { width: 100%; background: linear-gradient(135deg,#34d399,#10b981); border: none; border-radius: 8px; padding: 8px; color: #0b0c14; font-size: 0.78rem; font-weight: 800; cursor: pointer; }
  .dr-apply:hover { opacity: 0.9; }

  /* Topbar */
  .topbar {
    display: flex; align-items: center; gap: 10px; padding: 12px 32px;
    background: rgba(8,10,20,0.85); backdrop-filter: blur(20px);
    border-bottom: 1px solid var(--border); position: sticky; top: 0; z-index: 100;
    flex-wrap: wrap;
  }
  .topbar-logo { width: 32px; height: 32px; border-radius: 9px; flex-shrink: 0; background: linear-gradient(135deg,#34d399,#10b981); display: flex; align-items: center; justify-content: center; }
  .topbar-brand { font-size: 0.9rem; font-weight: 700; letter-spacing: -0.02em; }
  .topbar-spacer { flex: 1; }
  .tbtn { border: none; border-radius: 8px; padding: 6px 12px; font-size: 0.74rem; font-weight: 600; cursor: pointer; transition: all 0.15s; display: inline-flex; align-items: center; gap: 5px; }
  .tbtn-ghost { background: var(--surface2); color: var(--text-muted); border: 1px solid var(--border); }
  .tbtn-ghost:hover { color: var(--text); border-color: var(--border-light); }
  .tbtn-primary { background: linear-gradient(135deg,#34d399,#10b981); color: #0b0c14; }
  .user-pill { display: flex; align-items: center; gap: 8px; background: var(--surface); border: 1px solid var(--border); border-radius: 999px; padding: 4px 14px 4px 4px; }
  .user-pill-av { width: 24px; height: 24px; border-radius: 50%; flex-shrink: 0; background: linear-gradient(135deg,#34d399,#10b981); color: #0b0c14; font-size: 0.62rem; font-weight: 800; display: flex; align-items: center; justify-content: center; }
  .user-pill-email { font-size: 0.73rem; color: var(--text-muted); max-width: 180px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

  /* Page */
  .page { padding: 28px 32px; max-width: 1400px; margin: 0 auto; }
  .sec-label { display: flex; align-items: center; gap: 14px; margin: 24px 0 14px; }
  .sec-label-text { font-size: 0.66rem; font-weight: 800; text-transform: uppercase; letter-spacing: 0.12em; color: var(--text-dim); }
  .sec-label-line { flex: 1; height: 1px; background: var(--border); }

  /* Layout: 320px sidebar + content */
  .crm-layout { display: grid; grid-template-columns: 340px 1fr; gap: 18px; }
  @media(max-width:880px) { .crm-layout { grid-template-columns: 1fr; } }

  .student-list-card {
    background: var(--surface); border: 1px solid var(--border); border-radius: 14px;
    overflow: hidden; display: flex; flex-direction: column; max-height: 80vh;
  }
  .student-list-head { padding: 14px 16px; border-bottom: 1px solid var(--border); display: flex; align-items: center; gap: 8px; }
  .student-list-search {
    flex: 1; background: var(--surface2); border: 1px solid var(--border); border-radius: 9px;
    padding: 8px 12px; font-size: 0.84rem; color: var(--text); outline: none;
  }
  .student-list-search:focus { border-color: var(--green); }
  .student-list-add {
    background: linear-gradient(135deg,#34d399,#10b981); color: #0b0c14;
    border: none; border-radius: 9px; padding: 8px 12px; font-weight: 800; cursor: pointer; font-size: 0.84rem;
  }
  .student-list-body { overflow-y: auto; flex: 1; }
  .student-row {
    padding: 12px 16px; border-bottom: 1px solid var(--border); cursor: pointer;
    display: flex; align-items: center; gap: 12px; transition: background 0.1s;
  }
  .student-row:hover { background: var(--surface2); }
  .student-row.active { background: rgba(52,211,153,0.08); border-left: 3px solid var(--green); padding-left: 13px; }
  .student-av { width: 36px; height: 36px; border-radius: 50%; flex-shrink: 0; background: var(--surface2); color: var(--text); display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 0.84rem; }
  .student-row.active .student-av { background: linear-gradient(135deg,#34d399,#10b981); color: #0b0c14; }
  .student-row-info { flex: 1; min-width: 0; }
  .student-row-name { font-size: 0.88rem; font-weight: 600; color: var(--text); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .student-row-meta { font-size: 0.7rem; color: var(--text-muted); margin-top: 2px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .status-dot { display: inline-block; width: 7px; height: 7px; border-radius: 50%; margin-right: 4px; }
  .status-Active { background: #34d399; }
  .status-Paused { background: #fbbf24; }
  .status-Graduated { background: #6b9eff; }
  .status-Cancelled { background: #f87171; }
  .status-Lead { background: #a78bfa; }

  .student-list-empty { padding: 32px 16px; color: var(--text-muted); font-size: 0.84rem; text-align: center; }

  /* Profile */
  .profile-card {
    background: var(--surface); border: 1px solid var(--border); border-radius: 14px;
    padding: 24px 24px;
  }
  .profile-empty { padding: 60px 30px; text-align: center; color: var(--text-muted); font-size: 0.92rem; }
  .profile-empty-icon { width: 56px; height: 56px; margin: 0 auto 14px; border-radius: 16px; background: var(--surface2); display: flex; align-items: center; justify-content: center; color: var(--text-dim); }
  .profile-head { display: flex; align-items: center; gap: 16px; margin-bottom: 22px; padding-bottom: 18px; border-bottom: 1px solid var(--border); flex-wrap: wrap; }
  .profile-av { width: 56px; height: 56px; border-radius: 16px; background: linear-gradient(135deg,#34d399,#10b981); color: #0b0c14; display: flex; align-items: center; justify-content: center; font-size: 1.3rem; font-weight: 900; flex-shrink: 0; }
  .profile-title { flex: 1; min-width: 200px; }
  .profile-name { font-size: 1.4rem; font-weight: 800; letter-spacing: -0.02em; }
  .profile-sub { color: var(--text-muted); font-size: 0.82rem; margin-top: 3px; }
  .profile-actions { display: flex; gap: 8px; flex-wrap: wrap; }
  .profile-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px 18px; }
  @media(max-width:600px) { .profile-grid { grid-template-columns: 1fr; } }
  .field { }
  .field-label { font-size: 0.66rem; font-weight: 800; text-transform: uppercase; letter-spacing: 0.08em; color: var(--text-dim); margin-bottom: 6px; }
  .field-input, .field-select, .field-textarea {
    width: 100%; background: var(--surface2); border: 1px solid var(--border); border-radius: 10px;
    padding: 9px 12px; color: var(--text); font-size: 0.88rem; outline: none; font-family: inherit;
  }
  .field-input:focus, .field-select:focus, .field-textarea:focus { border-color: var(--green); }
  .field-textarea { min-height: 110px; resize: vertical; }
  .field-full { grid-column: 1 / -1; }

  .profile-save {
    background: linear-gradient(135deg,#34d399,#10b981); color: #0b0c14;
    border: none; border-radius: 10px; padding: 10px 22px; font-weight: 800; cursor: pointer;
  }
  .profile-save:disabled { opacity: 0.5; cursor: not-allowed; }
  .profile-delete {
    background: rgba(248,113,113,0.1); border: 1px solid rgba(248,113,113,0.3);
    color: var(--red); border-radius: 10px; padding: 10px 16px; font-weight: 700; cursor: pointer;
  }
  .profile-delete:hover { background: rgba(248,113,113,0.18); }
  .profile-msg { font-size: 0.78rem; min-height: 1em; margin-left: 8px; align-self: center; }

  .profile-section { margin-top: 22px; }
  .profile-section-head {
    display: flex; align-items: center; gap: 12px; margin-bottom: 10px;
    padding-bottom: 6px; border-bottom: 1px solid var(--border);
  }
  .profile-section-title { font-size: 0.7rem; font-weight: 800; text-transform: uppercase; letter-spacing: 0.1em; color: var(--green); }
  .profile-section-line { flex: 1; }

  .field-checkbox {
    display: flex; align-items: center; gap: 9px;
    background: var(--surface2); border: 1px solid var(--border); border-radius: 10px;
    padding: 9px 12px; font-size: 0.84rem; cursor: pointer; user-select: none;
  }
  .field-checkbox input { width: 16px; height: 16px; accent-color: var(--green); cursor: pointer; flex-shrink: 0; }
  .field-checkbox.checked { border-color: var(--green); background: rgba(52,211,153,0.08); }

  .badges { display: inline-flex; gap: 6px; flex-wrap: wrap; margin-top: 4px; }
  .badge { font-size: 0.62rem; padding: 2px 8px; border-radius: 999px; font-weight: 700; letter-spacing: 0.04em; text-transform: uppercase; }
  .badge.win  { background: rgba(251,191,36,0.18); color: #fbbf24; }
  .badge.ver  { background: rgba(52,211,153,0.18); color: #34d399; }
  .badge.exp  { background: rgba(248,113,113,0.18); color: #f87171; }
</style>
</head>
<body data-state="loading">

<!-- Boot -->
<div id="boot" class="full-center"><div class="spinner"></div></div>

<!-- Login -->
<div id="login" class="full-center">
  <div class="login-wrap">
    <div class="login-logo">
      <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#0b0c14" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
    </div>
    <div class="login-card">
      <h1>Welcome back</h1>
      <p class="sub">Sign in to access the mentorship CRM</p>
      <form id="loginForm">
        <div class="input-group">
          <label class="input-label" for="email">Email</label>
          <input class="auth-input" type="email" id="email" required autocomplete="email">
        </div>
        <div class="input-group">
          <label class="input-label" for="password">Password</label>
          <input class="auth-input" type="password" id="password" required autocomplete="current-password">
        </div>
        <button type="submit" class="auth-btn" id="sendBtn">Sign In</button>
        <div class="auth-error" id="loginError"></div>
      </form>
    </div>
  </div>
</div>

<!-- Denied -->
<div id="denied" class="full-center">
  <div style="text-align:center;max-width:420px;">
    <h2 style="font-size:1.4rem;margin-bottom:8px;">Access Denied</h2>
    <p style="color:var(--text-muted);margin-bottom:18px;">You don't have permission to view the Mentorship CRM.</p>
    <button class="tbtn tbtn-ghost" id="deniedSignOutBtn">Sign Out</button>
  </div>
</div>

<!-- App -->
<div id="app">
  <header class="topbar">
    <div class="topbar-logo" style="order:0;">
      <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#0b0c14" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/></svg>
    </div>
    <div class="topbar-brand" style="order:1;">Mentorship CRM</div>

    <div class="daterange-wrap" id="daterangeWrap" style="order:10;">
      <button class="daterange-btn" id="daterangeBtn">
        <svg xmlns="http://www.w3.org/2000/svg" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
        <span id="drLabel">All Time</span>
        <svg xmlns="http://www.w3.org/2000/svg" width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"/></svg>
      </button>
      <div class="daterange-popup" id="daterangePopup">
        <div class="dr-presets">
          <button class="dr-preset active" data-preset="all">All Time</button>
          <button class="dr-preset" data-preset="last-30">Last 30 Days</button>
          <button class="dr-preset" data-preset="this-week">This Week (Thu – Wed)</button>
          <button class="dr-preset" data-preset="last-week">Last Week (Thu – Wed)</button>
          <button class="dr-preset" data-preset="mtd">Month to Date</button>
        </div>
        <div class="dr-divider"></div>
        <div class="dr-custom-label">Custom Range (joined date)</div>
        <div class="dr-custom-row">
          <input type="date" class="dr-date-input" id="dateFrom">
          <span class="dr-sep">→</span>
          <input type="date" class="dr-date-input" id="dateTo">
        </div>
        <button class="dr-apply" id="drApply">Apply</button>
      </div>
    </div>

    <button class="tbtn tbtn-ghost" id="refreshBtn" style="order:20;" title="Refresh data">
      <svg id="refreshIcon" xmlns="http://www.w3.org/2000/svg" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="23 4 23 10 17 10"/><polyline points="1 20 1 14 7 14"/><path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"/></svg>
      Refresh
    </button>
    <button class="tbtn tbtn-ghost" id="themeBtn" style="order:30;font-size:1rem;padding:5px 10px;" title="Toggle theme"></button>

    <div class="nav-dropdown" id="navDropdown" style="order:40;position:relative;">
      <button class="tbtn tbtn-ghost" id="navDropdownBtn">Dashboards ▾</button>
      <div class="nav-dropdown-menu" id="navDropMenu" style="display:none;position:absolute;top:100%;right:0;background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:6px;margin-top:6px;min-width:200px;z-index:200;"></div>
    </div>

    <div class="user-pill" style="order:50;">
      <div class="user-pill-av" id="userAvatar">U</div>
      <div class="user-pill-email" id="userEmail">…</div>
    </div>
    <button class="tbtn tbtn-ghost" id="signOutBtn" style="order:60;">
      <svg xmlns="http://www.w3.org/2000/svg" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
      Sign Out
    </button>
  </header>

  <div class="page">
    <div class="sec-label">
      <span class="sec-label-text">Students</span>
      <div class="sec-label-line"></div>
      <span style="font-size:0.72rem;color:var(--text-muted);" id="studentTotalCount">—</span>
    </div>

    <div class="crm-layout">
      <!-- List -->
      <div class="student-list-card">
        <div class="student-list-head">
          <input class="student-list-search" id="studentSearch" type="search" placeholder="Search name, email, mentor…">
          <button class="student-list-add" id="addStudentBtn">+ New</button>
        </div>
        <div class="student-list-body" id="studentList">
          <div class="student-list-empty">Loading…</div>
        </div>
      </div>

      <!-- Profile -->
      <div class="profile-card" id="profileCard">
        <div class="profile-empty">
          <div class="profile-empty-icon">

function isoDate(d) { return d.toISOString().slice(0, 10); }
function getPresetRange(preset) {
  const today = new Date(); today.setHours(0,0,0,0);
  if (preset === 'all') return { from: '0001-01-01', to: '9999-12-31' };
  if (preset === 'last-30') {
    const f = new Date(today); f.setDate(today.getDate() - 29);
    return { from: isoDate(f), to: isoDate(today) };
  }
  if (preset === 'mtd') {
    const f = new Date(today.getFullYear(), today.getMonth(), 1);
    return { from: isoDate(f), to: isoDate(today) };
  }
  // Thu-Wed weekly slot used across the app
  function weekRange(offsetWeeks) {
    const dow = today.getDay();             // 0 Sun .. 6 Sat
    // Days back to most recent Thursday
    const daysBackToThu = (dow >= 4) ? (dow - 4) : (dow + 3);
    const thu = new Date(today); thu.setDate(today.getDate() - daysBackToThu - 7 * offsetWeeks);
    const wed = new Date(thu);   wed.setDate(thu.getDate() + 6);
    return { from: isoDate(thu), to: isoDate(wed) };
  }
  if (preset === 'this-week') return weekRange(0);
  if (preset === 'last-week') return weekRange(1);
  return { from: '0001-01-01', to: '9999-12-31' };
}
const DR_LABELS = { 'all': 'All Time', 'last-30': 'Last 30 Days', 'this-week': 'This Week', 'last-week': 'Last Week', 'mtd': 'Month to Date' };

let drFrom = '0001-01-01', drTo = '9999-12-31';

  document.getElementById('dateTo').value   = preset === 'all' ? '' : r.to;
  document.querySelectorAll('.dr-preset').forEach(b => b.classList.toggle('active', b.dataset.preset === preset));
  document.getElementById('drLabel').textContent = DR_LABELS[preset] || preset;
  document.getElementById('daterangePopup').classList.remove('open');
  if (reload) renderStudentList();
}

function _buildField(field, value) {
  const id = 'f-' + field.k;
  if (field.type === 'checkbox') {
    return `<label class="field-checkbox${value ? ' checked' : ''}" data-cb-for="${field.k}">
      <input type="checkbox" id="${id}" data-key="${field.k}"${value ? ' checked' : ''}>
      <span>${field.label}</span>
    </label>`;
  }
  let inner = '';
  if (field.type === 'select') {
    const opts = field.opts === 'mentors' ? mentors : (field.opts || []);
    let optHtml = '<option value="">— None —</option>';
    if (Array.isArray(opts)) {
      optHtml = opts.map(o => `<option value="${o}">${o}</option>`).join('');
      if (field.opts !== 'mentors') optHtml = '<option value=""></option>' + optHtml;
    }
    inner = `<select class="field-select" id="${id}" data-key="${field.k}">${optHtml}</select>`;
  } else if (field.type === 'textarea') {
    inner = `<textarea class="field-textarea" id="${id}" data-key="${field.k}"></textarea>`;
  } else {
    const t = field.type === 'number' ? 'number' : (field.type === 'tel' ? 'tel' : (field.type === 'email' ? 'email' : (field.type === 'date' ? 'date' : 'text')));
    inner = `<input class="field-input" type="${t}" id="${id}" data-key="${field.k}"${field.placeholder ? ` placeholder="${field.placeholder}"` : ''}>`;
  }
  return `<div class="field${field.full ? ' field-full' : ''}">
    <div class="field-label">${field.label}</div>${inner}
  </div>`;
}

function _buildPausesPanel() {
  const sorted = [...currentPauses].sort((a, b) =>
    String(b.start_date || '').localeCompare(String(a.start_date || '')));
  const rows = sorted.map(p => {
    const isActive = !p.end_date;
    const days = isActive
      ? '∞ ongoing'
      : (() => {
          const ms = Date.parse(p.end_date) - Date.parse(p.start_date);
          const d = Math.max(0, Math.round(ms / 86400000));
          return d + 'd';
        })();
    return `<tr data-pause-id="${p.id}" ${isActive ? 'style="background:rgba(251,191,36,0.06);"' : ''}>
      <td style="padding:6px 8px;"><input type="date" class="field-input pause-start" value="${p.start_date || ''}" data-pid="${p.id}"></td>
      <td style="padding:6px 8px;"><input type="date" class="field-input pause-end"   value="${p.end_date   || ''}" data-pid="${p.id}" placeholder="ongoing"></td>
      <td style="padding:6px 8px;"><input type="text" class="field-input pause-notes" value="" data-pid="${p.id}" placeholder="Notes"></td>
      <td style="padding:6px 8px;color:#7880a8;font-size:0.78rem;white-space:nowrap;">${days}${isActive ? ' <span style="color:#fbbf24;font-weight:700;">⏸ active</span>' : ''}</td>
      <td style="padding:6px 8px;text-align:right;"><button class="profile-delete pause-del" data-pid="${p.id}" style="padding:4px 10px;font-size:0.72rem;">✕</button></td>
    </tr>`;
  }).join('');
  return `
    <div class="profile-section">
      <div class="profile-section-head">
        <div class="profile-section-title">Pauses</div>
        <div class="profile-section-line"></div>
        <button class="profile-save" id="addPauseBtn" style="padding:6px 14px;font-size:0.78rem;">+ Add pause</button>
      </div>
      ${currentPauses.length === 0
        ? '<div style="padding:12px;color:var(--text-muted);font-size:0.84rem;background:var(--surface2);border-radius:10px;">No pauses yet. The student\'s lifecycle is computed straight from their onboarded date + months count.</div>'
        : `<div style="border:1px solid var(--border);border-radius:10px;overflow:hidden;">
            <table style="width:100%;border-collapse:collapse;font-size:0.82rem;">
              <thead style="background:var(--surface2);color:var(--text-dim);font-size:0.66rem;text-transform:uppercase;letter-spacing:0.06em;">
                <tr>
                  <th style="padding:8px;text-align:left;">Start</th>
                  <th style="padding:8px;text-align:left;">End <span style="color:var(--text-dim);text-transform:none;font-weight:400;">(blank = ongoing)</span></th>
                  <th style="padding:8px;text-align:left;">Notes</th>
                  <th style="padding:8px;text-align:left;">Length</th>
                  <th style="padding:8px;text-align:right;">&nbsp;</th>
                </tr>
              </thead>
              <tbody>${rows}</tbody>
            </table>
          </div>`}
    </div>`;
}

function _wirePauses() {
  // Populate notes (kept out of innerHTML for safety)
  for (const p of currentPauses) {
    const el = document.querySelector(`.pause-notes[data-pid="${p.id}"]`);
    if (el) el.value = p.notes || '';
  }
  // Save on change/blur
  ['pause-start', 'pause-end', 'pause-notes'].forEach(cls => {
    document.querySelectorAll('.' + cls).forEach(el => {
      el.addEventListener('change', () => savePauseField(el));
    });
  });
  document.querySelectorAll('.pause-del').forEach(btn => {
    btn.addEventListener('click', () => deletePause(Number(btn.dataset.pid)));
  });
  const addBtn = document.getElementById('addPauseBtn');
  if (addBtn) addBtn.addEventListener('click', addPause);
}

async function savePauseField(el) {
  const id = Number(el.dataset.pid);
  const fieldKey = el.classList.contains('pause-start') ? 'start_date'
                  : el.classList.contains('pause-end')  ? 'end_date'
                  : 'notes';
  const body = { id };
  body[fieldKey] = el.value || null;
  if (fieldKey === 'start_date' && !body[fieldKey]) {
    alert('A pause needs a start date.');
    // Reload to revert
    const sid = currentStudent?.id; if (sid) await openStudent(sid);
    return;
  }
  try {
    const r = await fetch(STUDENTS_BASE + '?api=update-pause', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', Authorization: 'Bearer ' + currentSession.access_token },
      body: JSON.stringify(body),
    });
    const j = await r.json();
    if (!r.ok) throw new Error(j.error || 'Failed');
    // Reload so derived lifecycle refreshes
    if (currentStudent?.id) {
      await openStudent(currentStudent.id);
      await loadStudents();
    }
  } catch (e) { alert('Pause save failed: ' + (e.message || e)); }
}

function addPause() {
  if (!currentStudent || !currentStudent.id) {
    alert('Save the student first, then add pauses.');
    return;
  }
  // Remove any existing modal
  document.getElementById('pauseModal')?.remove();
  const today = new Date().toISOString().slice(0, 10);
  const m = document.createElement('div');
  m.id = 'pauseModal';
  m.style.cssText = 'position:fixed;inset:0;background:rgba(8,9,18,0.78);backdrop-filter:blur(8px);z-index:10005;display:flex;align-items:center;justify-content:center;padding:20px;font-family:-apple-system,BlinkMacSystemFont,Inter,sans-serif;';
  m.innerHTML = `
    <div style="background:#13141f;border:1px solid #1f2438;border-radius:18px;padding:24px 26px;max-width:420px;width:100%;color:#eaecf8;box-shadow:0 24px 60px rgba(0,0,0,0.55);">
      <div style="font-size:1.0rem;font-weight:800;letter-spacing:-0.02em;margin-bottom:4px;">Add a pause</div>
      <div style="font-size:0.78rem;color:#7880a8;margin-bottom:18px;">Lifecycle freezes during a pause and the effective end date shifts forward by the pause length.</div>

      <div class="field" style="margin-bottom:12px;">
        <div class="field-label">Start date *</div>
        <input class="field-input" type="date" id="pauseModalStart" value="${today}" required>
      </div>
      <div class="field" style="margin-bottom:12px;">
        <div class="field-label">End date <span style="text-transform:none;font-weight:500;color:var(--text-dim);">(leave blank = ongoing)</span></div>
        <input class="field-input" type="date" id="pauseModalEnd">
      </div>
      <div class="field" style="margin-bottom:18px;">
        <div class="field-label">Notes</div>
        <textarea class="field-textarea" id="pauseModalNotes" placeholder="Why is this student pausing?" style="min-height:80px;"></textarea>
      </div>
      <div id="pauseModalErr" style="color:var(--red);font-size:0.78rem;min-height:1em;margin-bottom:8px;"></div>
      <div style="display:flex;gap:10px;justify-content:flex-end;">
        <button id="pauseModalCancel" style="background:transparent;border:1px solid #1f2438;color:#7880a8;border-radius:9px;padding:8px 16px;font-weight:700;cursor:pointer;">Cancel</button>
        <button id="pauseModalSave" class="profile-save" style="padding:8px 18px;">Save pause</button>
      </div>
    </div>
  `;
  document.body.appendChild(m);
  function close() { m.remove(); }
  document.getElementById('pauseModalCancel').addEventListener('click', close);
  m.addEventListener('click', e => { if (e.target === m) close(); });
  // Esc to close
  function onKey(e) { if (e.key === 'Escape') { close(); document.removeEventListener('keydown', onKey); } }
  document.addEventListener('keydown', onKey);

  const startEl = document.getElementById('pauseModalStart');
  const endEl   = document.getElementById('pauseModalEnd');
  const notesEl = document.getElementById('pauseModalNotes');
  const errEl   = document.getElementById('pauseModalErr');
  const saveBtn = document.getElementById('pauseModalSave');
  startEl.focus(); startEl.select();

  saveBtn.addEventListener('click', async () => {
    errEl.textContent = '';
    const start = startEl.value;
    const end   = endEl.value || null;
    const notes = notesEl.value.trim() || null;
    if (!start) { errEl.textContent = 'Start date is required.'; return; }
    if (end && end < start) { errEl.textContent = "End date can't be before the start date."; return; }
    saveBtn.disabled = true; saveBtn.textContent = 'Saving…';
    try {
      const r = await fetch(STUDENTS_BASE + '?api=add-pause', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', Authorization: 'Bearer ' + currentSession.access_token },
        body: JSON.stringify({ studentId: currentStudent.id, start_date: start, end_date: end, notes }),
      });
      const j = await r.json();
      if (!r.ok) throw new Error(j.error || 'Failed');
      close();
      await openStudent(currentStudent.id);
      await loadStudents();
    } catch (e) {
      errEl.textContent = e.message || 'Failed';
      saveBtn.disabled = false; saveBtn.textContent = 'Save pause';
    }
  });
}

async function deletePause(id) {
  if (!confirm('Delete this pause?')) return;
  try {
    const r = await fetch(STUDENTS_BASE + '?api=delete-pause', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', Authorization: 'Bearer ' + currentSession.access_token },
      body: JSON.stringify({ id }),
    });
    const j = await r.json();
    if (!r.ok) throw new Error(j.error || 'Failed');
    await openStudent(currentStudent.id);
    await loadStudents();
  } catch (e) { alert('Delete pause failed: ' + (e.message || e)); }
}

function _buildResignsPanel() {
  const fmtMoney = n => n == null ? '—' : '$' + Number(n).toLocaleString();
  const sorted = [...currentResigns].sort((a, b) =>
    String(b.resign_date || '').localeCompare(String(a.resign_date || '')));
  const totalAdded = sorted.reduce((s, r) => s + (Number(r.months_added) || 0), 0);
  const rows = sorted.map(r => `
    <tr data-resign-id="${r.id}">
      <td style="padding:6px 8px;"><input type="date"   class="field-input resign-date"   value="${r.resign_date || ''}" data-rid="${r.id}"></td>
      <td style="padding:6px 8px;"><input type="number" class="field-input resign-months" value="${r.months_added || 0}" data-rid="${r.id}" min="1" step="1" style="max-width:90px;"></td>
      <td style="padding:6px 8px;"><input type="number" class="field-input resign-amount" value="${r.amount != null ? r.amount : ''}" data-rid="${r.id}" min="0" step="0.01" placeholder="(optional)" style="max-width:120px;"></td>
      <td style="padding:6px 8px;"><input type="text"   class="field-input resign-notes"  value="" data-rid="${r.id}" placeholder="Notes"></td>
      <td style="padding:6px 8px;text-align:right;"><button class="profile-delete resign-del" data-rid="${r.id}" style="padding:4px 10px;font-size:0.72rem;">✕</button></td>
    </tr>`).join('');
  return `
    <div class="profile-section">
      <div class="profile-section-head">
        <div class="profile-section-title">Resigns ${totalAdded ? `<span style="color:var(--text-muted);font-weight:600;text-transform:none;letter-spacing:0;font-size:0.72rem;margin-left:8px;">+${totalAdded} months total</span>` : ''}</div>
        <div class="profile-section-line"></div>
        <button class="profile-save" id="addResignBtn" style="padding:6px 14px;font-size:0.78rem;">+ Add resign</button>
      </div>
      ${currentResigns.length === 0
        ? '<div style="padding:12px;color:var(--text-muted);font-size:0.84rem;background:var(--surface2);border-radius:10px;">No resigns yet. Each resign extends the course duration by the number of months you specify.</div>'
        : `<div style="border:1px solid var(--border);border-radius:10px;overflow:hidden;">
            <table style="width:100%;border-collapse:collapse;font-size:0.82rem;">
              <thead style="background:var(--surface2);color:var(--text-dim);font-size:0.66rem;text-transform:uppercase;letter-spacing:0.06em;">
                <tr>
                  <th style="padding:8px;text-align:left;">Date</th>
                  <th style="padding:8px;text-align:left;">Months added</th>
                  <th style="padding:8px;text-align:left;">Amount</th>
                  <th style="padding:8px;text-align:left;">Notes</th>
                  <th style="padding:8px;text-align:right;">&nbsp;</th>
                </tr>
              </thead>
              <tbody>${rows}</tbody>
            </table>
          </div>`}
    </div>`;
}

function _wireResigns() {
  // Populate notes via .value (user-supplied — never innerHTML)
  for (const r of currentResigns) {
    const el = document.querySelector(`.resign-notes[data-rid="${r.id}"]`);
    if (el) el.value = r.notes || '';
  }
  ['resign-date','resign-months','resign-amount','resign-notes'].forEach(cls => {
    document.querySelectorAll('.' + cls).forEach(el => {
      el.addEventListener('change', () => saveResignField(el));
    });
  });
  document.querySelectorAll('.resign-del').forEach(btn => {
    btn.addEventListener('click', () => deleteResign(Number(btn.dataset.rid)));
  });
  const addBtn = document.getElementById('addResignBtn');
  if (addBtn) addBtn.addEventListener('click', addResign);
}

async function saveResignField(el) {
  const id = Number(el.dataset.rid);
  const fieldKey = el.classList.contains('resign-date')   ? 'resign_date'
                  : el.classList.contains('resign-months') ? 'months_added'
                  : el.classList.contains('resign-amount') ? 'amount'
                  : 'notes';
  const body = { id };
  if (fieldKey === 'months_added') {
    const v = Number(el.value); if (!v || v <= 0) { alert('Months must be a positive number.'); return; }
    body[fieldKey] = v;
  } else if (fieldKey === 'amount') {
    body[fieldKey] = el.value === '' ? null : Number(el.value);
  } else {
    body[fieldKey] = el.value || null;
    if (fieldKey === 'resign_date' && !body[fieldKey]) {
      alert('A resign needs a date.');
      if (currentStudent?.id) await openStudent(currentStudent.id);
      return;
    }
  }
  try {
    const r = await fetch(STUDENTS_BASE + '?api=update-resign', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', Authorization: 'Bearer ' + currentSession.access_token },
      body: JSON.stringify(body),
    });
    const j = await r.json();
    if (!r.ok) throw new Error(j.error || 'Failed');
    if (currentStudent?.id) {
      await openStudent(currentStudent.id);
      await loadStudents();
    }
  } catch (e) { alert('Resign save failed: ' + (e.message || e)); }
}

function addResign() {
  if (!currentStudent || !currentStudent.id) {
    alert('Save the student first, then add resigns.');
    return;
  }
  document.getElementById('resignModal')?.remove();
  const today = new Date().toISOString().slice(0, 10);
  const defaultMonths = Number(currentStudent.months_count) || 12;
  const m = document.createElement('div');
  m.id = 'resignModal';
  m.style.cssText = 'position:fixed;inset:0;background:rgba(8,9,18,0.78);backdrop-filter:blur(8px);z-index:10005;display:flex;align-items:center;justify-content:center;padding:20px;font-family:-apple-system,BlinkMacSystemFont,Inter,sans-serif;';
  m.innerHTML = `
    <div style="background:#13141f;border:1px solid #1f2438;border-radius:18px;padding:24px 26px;max-width:440px;width:100%;color:#eaecf8;box-shadow:0 24px 60px rgba(0,0,0,0.55);">
      <div style="font-size:1.0rem;font-weight:800;letter-spacing:-0.02em;margin-bottom:4px;">Add a resign</div>
      <div style="font-size:0.78rem;color:#7880a8;margin-bottom:18px;">Extends the course by the number of months you choose. The student's effective end date moves out automatically.</div>
      <div class="field" style="margin-bottom:12px;">
        <div class="field-label">Resign date *</div>
        <input class="field-input" type="date" id="resignModalDate" value="${today}" required>
      </div>
      <div class="field" style="margin-bottom:12px;">
        <div class="field-label">Months added *</div>
        <input class="field-input" type="number" id="resignModalMonths" value="${defaultMonths}" min="1" step="1" required>
      </div>
      <div class="field" style="margin-bottom:12px;">
        <div class="field-label">Amount paid <span style="text-transform:none;font-weight:500;color:var(--text-dim);">(optional)</span></div>
        <input class="field-input" type="number" id="resignModalAmount" min="0" step="0.01" placeholder="e.g. 1500">
      </div>
      <div class="field" style="margin-bottom:18px;">
        <div class="field-label">Notes</div>
        <textarea class="field-textarea" id="resignModalNotes" placeholder="Plan / instalments / anything to remember…" style="min-height:80px;"></textarea>
      </div>
      <div id="resignModalErr" style="color:var(--red);font-size:0.78rem;min-height:1em;margin-bottom:8px;"></div>
      <div style="display:flex;gap:10px;justify-content:flex-end;">
        <button id="resignModalCancel" style="background:transparent;border:1px solid #1f2438;color:#7880a8;border-radius:9px;padding:8px 16px;font-weight:700;cursor:pointer;">Cancel</button>
        <button id="resignModalSave" class="profile-save" style="padding:8px 18px;">Save resign</button>
      </div>
    </div>
  `;
  document.body.appendChild(m);
  function close() { m.remove(); }
  document.getElementById('resignModalCancel').addEventListener('click', close);
  m.addEventListener('click', e => { if (e.target === m) close(); });
  function onKey(e) { if (e.key === 'Escape') { close(); document.removeEventListener('keydown', onKey); } }
  document.addEventListener('keydown', onKey);

  const dateEl  = document.getElementById('resignModalDate');
  const monEl   = document.getElementById('resignModalMonths');
  const amtEl   = document.getElementById('resignModalAmount');
  const notesEl = document.getElementById('resignModalNotes');
  const errEl   = document.getElementById('resignModalErr');
  const saveBtn = document.getElementById('resignModalSave');
  dateEl.focus();

  saveBtn.addEventListener('click', async () => {
    errEl.textContent = '';
    const resign_date = dateEl.value;
    const months_added = Number(monEl.value);
    const amount = amtEl.value === '' ? null : Number(amtEl.value);
    const notes = notesEl.value.trim() || null;
    if (!resign_date) { errEl.textContent = 'Resign date is required.'; return; }
    if (!months_added || months_added <= 0) { errEl.textContent = 'Months added must be a positive number.'; return; }
    saveBtn.disabled = true; saveBtn.textContent = 'Saving…';
    try {
      const r = await fetch(STUDENTS_BASE + '?api=add-resign', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', Authorization: 'Bearer ' + currentSession.access_token },
        body: JSON.stringify({ studentId: currentStudent.id, resign_date, months_added, amount, notes }),
      });
      const j = await r.json();
      if (!r.ok) throw new Error(j.error || 'Failed');
      close();
      await openStudent(currentStudent.id);
      await loadStudents();
    } catch (e) {
      errEl.textContent = e.message || 'Failed';
      saveBtn.disabled = false; saveBtn.textContent = 'Save resign';
    }
  });
}

async function deleteResign(id) {
  if (!confirm('Delete this resign? The course duration will shrink back accordingly.')) return;
  try {
    const r = await fetch(STUDENTS_BASE + '?api=delete-resign', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', Authorization: 'Bearer ' + currentSession.access_token },
      body: JSON.stringify({ id }),
    });
    const j = await r.json();
    if (!r.ok) throw new Error(j.error || 'Failed');
    await openStudent(currentStudent.id);
    await loadStudents();
  } catch (e) { alert('Delete resign failed: ' + (e.message || e)); }
}

function renderProfile() {
  const card = document.getElementById('profileCard');
  if (!currentStudent) {
    card.innerHTML = '<div class="profile-empty">Pick a student from the list to see their profile.</div>';
    return;
  }
  const s = currentStudent;
  const isNew = !s.id;
  const initials = (s.name || '?').split(/\s+/).map(p => p[0] || '').join('').slice(0, 2).toUpperCase() || '?';

  // Build sections (with the Pauses panel slipping in between Coaching
  // and Lifecycle so the lifecycle date can reference it).
  const sectionsHtml = SECTIONS.map(([title, fields]) => {
    const grid = `
      <div class="profile-section">
        <div class="profile-section-head">
          <div class="profile-section-title">${title}</div>
          <div class="profile-section-line"></div>
        </div>
        <div class="profile-grid">
          ${fields.map(f => _buildField(f, s[f.k])).join('')}
        </div>
      </div>`;
    if (title === 'Coaching') {
      return grid + (isNew ? '' : _buildPausesPanel() + _buildResignsPanel());
    }
    return grid;
  }).join('');

  // Status badges in header — computed lifecycle is the source of truth.
  const badges = [];
  const ds = s.derived_status || 'Not onboarded';
  const dsClass = ds === 'Active' ? 'ver' : ds === 'Expiring soon' ? 'win' : ds === 'Expired' ? 'exp' : ds === 'Paused' ? 'win' : 'exp';
  const dsLabel = ds === 'Active' ? '● Active'
    : ds === 'Expiring soon' ? `⚠ Expiring soon (${s.days_left}d left)`
    : ds === 'Expired'       ? `⚠ Expired (${Math.abs(s.days_left || 0)}d ago)`
    : ds === 'Paused'        ? '⏸ Paused'
    : 'Not onboarded';
  badges.push(`<span class="badge ${dsClass}">${dsLabel}</span>`);
  if (s.effective_end_date) {
    badges.push(`<span class="badge ver" style="background:rgba(120,128,168,0.18);color:#7880a8;">Ends ${s.effective_end_date}</span>`);
  }
  if (s.paused_days_total) {
    badges.push(`<span class="badge ver" style="background:rgba(120,128,168,0.18);color:#7880a8;">${s.paused_days_total}d paused total</span>`);
  }
  if (s.resign_months_added) {
    badges.push(`<span class="badge ver" style="background:rgba(167,139,250,0.18);color:#a78bfa;">+${s.resign_months_added}mo from resigns</span>`);
  }
  if (s.winning_student)  badges.push('<span class="badge win">★ Winning</span>');
  if (s.verified)         badges.push('<span class="badge ver">✓ Verified</span>');

  card.innerHTML = `
    <div class="profile-head">
      <div class="profile-av" id="prof-av">${initials}</div>
      <div class="profile-title">
        <div class="profile-name" id="prof-display-name">${isNew ? 'New student' : ''}</div>
        <div class="profile-sub" id="prof-sub"></div>
        <div class="badges" id="prof-badges">${badges.join('')}</div>
      </div>
      <div class="profile-actions">
        <button class="profile-save" id="prof-save">${isNew ? 'Create' : 'Save'}</button>
        ${!isNew ? '<button class="profile-delete" id="prof-delete">Delete</button>' : ''}
        <span class="profile-msg" id="prof-msg"></span>
      </div>
    </div>
    ${sectionsHtml}
  `;

  // Populate values (textContent / .value — never innerHTML for user data)
  for (const [, fields] of SECTIONS) {
    for (const f of fields) {
      const el = document.getElementById('f-' + f.k);
      if (!el) continue;
      const v = s[f.k];
      if (f.type === 'checkbox') {
        el.checked = !!v;
      } else if (f.type === 'date') {
        el.value = v ? String(v).slice(0, 10) : '';
      } else if (f.type === 'select') {
        // For coach: ensure saved value exists as option even if not in mentors
        if (f.k === 'coach' && v && Array.isArray(mentors) && !mentors.includes(v)) {
          const opt = document.createElement('option'); opt.value = v; opt.textContent = v;
          el.appendChild(opt);
        }
        el.value = v == null ? '' : String(v);
      } else if (f.type === 'number') {
        el.value = v == null ? '' : String(v);
      } else {
        el.value = v == null ? '' : String(v);
      }
    }
  }
  // Status default
  const statusEl = document.getElementById('f-status');
  if (statusEl && !STATUSES.includes(statusEl.value)) statusEl.value = 'Active';

  // Header sub-line
  if (!isNew) {
    document.getElementById('prof-display-name').textContent = s.name || '(unnamed)';
    const subParts = [];
    if (s.status)            subParts.push(s.status);
    if (s.coach || s.mentor) subParts.push('Coach: ' + (s.coach || s.mentor));
    if (s.months_count != null) subParts.push(s.months_count + ' months');
    if (s.email)             subParts.push(s.email);
    document.getElementById('prof-sub').textContent = subParts.join(' · ');
  } else {
    document.getElementById('prof-sub').textContent = 'Fill in what you know and click Create.';
  }

  // Live header updates
  document.getElementById('f-name').addEventListener('input', () => {
    const n = document.getElementById('f-name').value || '?';
    document.getElementById('prof-av').textContent = n.split(/\s+/).map(p => p[0] || '').join('').slice(0, 2).toUpperCase() || '?';
    if (!isNew) document.getElementById('prof-display-name').textContent = n;
  });
  // Visual feedback on checkboxes
  card.querySelectorAll('.field-checkbox input[type="checkbox"]').forEach(cb => {
    cb.addEventListener('change', () => {
      cb.parentElement.classList.toggle('checked', cb.checked);
    });
  });
  // Auto-fill months_count from first_purchase_date when months is empty
  const fpd = document.getElementById('f-first_purchase_date');
  const mc  = document.getElementById('f-months_count');
  if (fpd && mc) {
    fpd.addEventListener('change', () => {
      if (!fpd.value) return;
      const f = new Date(fpd.value + 'T00:00:00');
      const now = new Date();
      const months = (now.getFullYear() - f.getFullYear()) * 12 + (now.getMonth() - f.getMonth());
      if (months >= 0 && (!mc.value || mc.value === '0')) mc.value = String(months);
    });
  }

  document.getElementById('prof-save').addEventListener('click', saveStudent);
  if (!isNew) document.getElementById('prof-delete').addEventListener('click', deleteStudent);
  if (!isNew) { _wirePauses(); _wireResigns(); }
}

async function saveStudent() {
  const btn = document.getElementById('prof-save');
  const msg = document.getElementById('prof-msg');
  msg.textContent = ''; msg.style.color = '';

  const payload = { id: currentStudent.id || undefined };
  for (const [, fields] of SECTIONS) {
    for (const f of fields) {
      const el = document.getElementById('f-' + f.k);
      if (!el) continue;
      if (f.type === 'checkbox') {
        payload[f.k] = el.checked;
      } else if (f.type === 'number') {
        const v = el.value.trim();
        payload[f.k] = v === '' ? null : Number(v);
      } else {
        const v = (el.value || '').trim();
        payload[f.k] = v === '' ? null : v;
      }
    }
  }
  if (!payload.name) {
    msg.textContent = 'Name is required'; msg.style.color = 'var(--red)';
    return;
  }
  btn.disabled = true; btn.textContent = 'Saving…';
  try {
    const r = await fetch(STUDENTS_BASE + '?api=upsert', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', Authorization: 'Bearer ' + currentSession.access_token },
      body: JSON.stringify(payload),
    });
    const j = await r.json();
    if (!r.ok) throw new Error(j.error || 'Failed');
    currentStudent.id = j.id;
    msg.textContent = '✓ Saved'; msg.style.color = 'var(--green)';
    await loadStudents();
    await openStudent(j.id);
  } catch (e) {
    msg.textContent = e.message || 'Failed';
    msg.style.color = 'var(--red)';
  } finally {
    btn.disabled = false;
    btn.textContent = currentStudent && currentStudent.id ? 'Save' : 'Create';
    setTimeout(() => { msg.textContent = ''; }, 4000);
  }
}

async function deleteStudent() {
  if (!currentStudent || !currentStudent.id) return;
  if (!confirm(`Delete ${currentStudent.name}? This can't be undone.`)) return;
  try {
    const r = await fetch(STUDENTS_BASE + '?api=delete', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', Authorization: 'Bearer ' + currentSession.access_token },
      body: JSON.stringify({ id: currentStudent.id }),
    });
    const j = await r.json();
    if (!r.ok) throw new Error(j.error || 'Failed');
    currentStudent = null;
    await loadStudents();
    renderProfile();
  } catch (e) {
    alert('Delete failed: ' + (e.message || e));
  }
}
