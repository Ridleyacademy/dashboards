<style>
  :root {
    --bg: #080a14; --surface: #0f1120; --surface2: #141728; --surface3: #191e30;
    --border: #1f2438; --border-light: #272d45;
    --text: #eaecf8; --text-muted: #7880a8; --text-dim: #3e4668;
    --blue: #6b9eff; --blue-bg: rgba(107,158,255,0.12);
    --green: #34d399; --green-bg: rgba(52,211,153,0.12);
    --gold: #fbbf24; --gold-bg: rgba(251,191,36,0.12);
    --red: #f87171; --red-bg: rgba(248,113,113,0.12);
  }
  body.light {
    --bg:#f0f2fa; --surface:#fff; --surface2:#f5f6fc; --surface3:#eceef8;
    --border:#dde1f2; --border-light:#ccd1e8; --text:#0f1220; --text-muted:#525b82; --text-dim:#9099be;
  }
  * { box-sizing:border-box; margin:0; padding:0; }
  body { background:var(--bg); color:var(--text); font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif; }
  #boot { padding:64px 20px; text-align:center; color:var(--text-dim); }
  body[data-state="loading"] #app { display:none; }
  body[data-state="app"] #boot { display:none; }
  .topbar { position:sticky; top:0; z-index:100; background:rgba(8,10,20,0.85); backdrop-filter:blur(16px); border-bottom:1px solid var(--border); padding:0 24px; height:56px; display:flex; align-items:center; gap:10px; }
  body.light .topbar { background:rgba(255,255,255,0.85); }
  .topbar-logo { width:32px; height:32px; border-radius:9px; flex-shrink:0; background:linear-gradient(135deg,#34d399,#6b9eff); display:flex; align-items:center; justify-content:center; box-shadow:0 0 14px rgba(52,211,153,0.35); }
  .topbar-brand { font-size:0.82rem; font-weight:800; letter-spacing:-0.01em; color:var(--text); margin-right:4px; }
  .tbtn { border:none; border-radius:8px; padding:6px 12px; font-size:0.74rem; font-weight:600; cursor:pointer; transition:all 0.15s; display:inline-flex; align-items:center; gap:5px; font-family:inherit; }
  .tbtn-ghost { background:var(--surface2); color:var(--text-muted); border:1px solid var(--border); }
  .tbtn-ghost:hover { color:var(--text); border-color:var(--border-light); }
  .user-pill { display:flex; align-items:center; gap:7px; background:var(--surface2); border:1px solid var(--border); border-radius:20px; padding:4px 12px 4px 4px; margin-left:auto; }
  .user-pill-av { width:26px; height:26px; border-radius:50%; background:linear-gradient(135deg,#34d399,#6b9eff); color:#06231a; display:flex; align-items:center; justify-content:center; font-size:0.72rem; font-weight:800; }
  .user-pill-email { font-size:0.74rem; color:var(--text-muted); max-width:180px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .nav-dropdown { position:relative; }
  .nav-dropdown-menu { display:none; position:fixed; top:60px; right:12px; left:auto; bottom:auto; min-width:210px; max-height:calc(100vh - 76px); overflow-y:auto; background:var(--surface); border:1px solid var(--border-light); border-radius:12px; padding:6px; box-shadow:0 16px 40px rgba(0,0,0,0.55); z-index:1000; }
  .nav-dropdown-menu.open { display:block; }
  .nav-menu-link { display:flex; align-items:center; gap:9px; padding:9px 11px; border-radius:9px; color:var(--text); text-decoration:none; font-size:0.82rem; font-weight:600; }
  .nav-menu-link:hover { background:var(--surface2); }
  .nav-menu-link svg { width:16px; height:16px; opacity:0.8; flex-shrink:0; }
  .main { max-width:820px; margin:0 auto; padding:26px 20px 80px; }
  .page-title { font-size:1.5rem; font-weight:800; letter-spacing:-0.02em; }
  .page-sub { font-size:0.86rem; color:var(--text-dim); margin-top:4px; }
  .ts-summary { display:flex; gap:10px; margin:18px 0 10px; flex-wrap:wrap; }
  .ts-chip { background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:12px 16px; flex:1; min-width:140px; }
  .ts-chip .n { font-size:1.5rem; font-weight:900; letter-spacing:-0.02em; }
  .ts-chip .l { font-size:0.7rem; text-transform:uppercase; letter-spacing:.06em; color:var(--text-dim); font-weight:700; margin-top:2px; }
  .ts-chip.todo .n { color:var(--gold); }
  .ts-chip.done .n { color:var(--green); }
  .ts-sec-h { font-size:0.72rem; font-weight:800; letter-spacing:.06em; text-transform:uppercase; color:var(--text-muted); margin:26px 0 10px; }
  .ts-card { display:flex; align-items:center; gap:14px; background:var(--surface); border:1px solid var(--border); border-radius:13px; padding:14px 16px; margin-bottom:8px; cursor:pointer; transition:border-color .15s, transform .15s; }
  .ts-card:hover { border-color:var(--border-light); transform:translateY(-1px); }
  .ts-card.done { opacity:0.72; }
  .ts-mark { width:26px; height:26px; border-radius:50%; flex-shrink:0; display:flex; align-items:center; justify-content:center; font-weight:800; font-size:0.85rem; }
  .ts-mark.todo { background:var(--gold-bg); color:var(--gold); border:1px solid rgba(251,191,36,.4); }
  .ts-mark.done { background:var(--green-bg); color:var(--green); }
  .ts-body { flex:1; min-width:0; }
  .ts-top { display:flex; align-items:center; gap:8px; flex-wrap:wrap; }
  .ts-badge { font-size:0.58rem; font-weight:800; letter-spacing:.05em; text-transform:uppercase; padding:2px 8px; border-radius:5px; }
  .ts-badge.policy { background:var(--blue-bg); color:var(--blue); }
  .ts-badge.order { background:var(--gold-bg); color:var(--gold); }
  .ts-series { font-size:0.62rem; font-weight:700; padding:2px 8px; border-radius:999px; background:rgba(167,139,250,.14); color:#a78bfa; }
  .ts-title { font-size:0.95rem; font-weight:700; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .ts-meta { font-size:0.74rem; color:var(--text-dim); margin-top:3px; }
  .ts-empty { text-align:center; color:var(--text-dim); padding:40px 20px; font-size:0.9rem; }
  .ts-cta { font-size:0.72rem; color:var(--gold); font-weight:700; white-space:nowrap; }
</style>
</head>
